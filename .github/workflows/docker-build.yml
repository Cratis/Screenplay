name: Docker Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  # Source changes are covered by the nightly build on main and by Publish, which builds the image on every
  # release. Pull requests build it only when the image's own inputs change shape.
  schedule:
    - cron: "43 2 * * *"
  pull_request:
    branches:
      - "**"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
      - "**/*.csproj"
      - "**/package.json"
      - "**/*.props"
      - "**/*.targets"
      - "global.json"
      - ".yarnrc.yml"

jobs:
  already-ran:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - id: gate
        uses: Cratis/Workflows/.github/actions/skip-if-already-ran@main

  build:
    needs: already-ran
    if: needs.already-ran.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds both architectures the release publishes, without pushing. The build stages run on the build
      # platform, so the arm64 image needs no emulation.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  nightly-failure:
    if: needs.already-ran.outputs.skip != 'true' && (failure() && github.event_name == 'schedule')
    needs: [already-ran, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Nightly Docker build failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title | jq -r --arg t "$TITLE" 'map(select(.title == $t))[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label bug --body "The nightly Docker image build failed on main: $RUN_URL"
          fi
