name: MCP desktop packages

# Called from pull-requests.yml; the PR triggers and path filters live there.

on:
  workflow_dispatch:
  # Nightly on main: the full five-RID matrix, so PRs can keep a narrower native router.
  schedule:
    - cron: "23 2 * * *"
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        default: false
        type: boolean

permissions:
  contents: read

# Left unchanged on purpose: in a call `github.workflow` is the caller's name, and Publish calls this too.
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && !inputs.release
        with:
          fetch-depth: 0
      - name: Select native package matrix
        id: matrix
        shell: bash
        env:
          PR_SMOKE: ${{ github.event_name == 'pull_request' && !inputs.release }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Publish (including a release call from a PR), the nightly and manual runs retain all five RIDs.
          matrix='[{"rid":"osx-arm64","runner":"macos-15"},{"rid":"osx-x64","runner":"macos-15-intel"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"}]'
          if [[ "$PR_SMOKE" == 'true' ]]; then
            matrix='[{"rid":"linux-x64","runner":"ubuntu-latest"}]'
            changed_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            while IFS= read -r path; do
              case "$path" in
                Source/DotNET/Screenplay.Mcp/*|Source/DotNET/Tool/*|Source/DotNET/Screenplay/Workspaces/*|*.props|*.targets|global.json|.github/workflows/mcp-desktop.yml|.github/workflows/publish.yml)
                  matrix='[{"rid":"osx-arm64","runner":"macos-15"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"linux-x64","runner":"ubuntu-latest"}]'
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  # The embedded event model board is one self-contained HTML page with no native code, so it is
  # built once here and every package leg embeds the same file instead of rebuilding it per OS.
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      # yarn.lock is not committed, so setup-node's yarn cache cannot key on it; cache like publish.yml does.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/yarn.lock
          key: ${{ runner.os }}-node24-board-yarn-${{ hashFiles('**/package.json') }}
      - name: Build embedded event model board
        run: |
          corepack enable
          yarn install
          yarn workspaces foreach -Rt --from @cratis/screenplay-mcp-app run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenplay-event-model-board
          path: Source/Screenplay/McpApp/dist/event-model-board.html
          retention-days: 3
          if-no-files-found: error

  package:
    needs: [changes, board]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Resolve native NuGet SDK cohort
        id: native-nuget-context
        run: |
          sdk="$(dotnet --version)"
          test -n "$sdk"
          printf 'sdk=%s\n' "$sdk" >> "$GITHUB_OUTPUT"
      - name: Cache native NuGet packages
        id: native-nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@3f8a8a7ef75f72b6b089638b68ec2f9af8f593e3 # Workflows snapshot 2026-11-01 (issue #1139)
        with:
          path: ~/.nuget/packages
          key-prefix: native-nuget-v1-${{ matrix.rid }}-${{ runner.arch }}-sdk${{ steps.native-nuget-context.outputs.sdk }}
          key-files: |
            **/packages.lock.json
            **/*.props
            **/*.targets
            **/*.csproj
            **/[Nn]u[Gg]et.[Cc]onfig
            **/*.slnx
            **/*.sln
            **/global.json
            .github/workflows/mcp-desktop.yml
            .github/workflows/native-editor-repairs.yml
          mode: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'save' || 'restore' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging validators
        run: |
          npm install -g @anthropic-ai/mcpb@2.1.2
          python -m pip install jsonschema==4.26.0
      - name: Check portable plugin schemas and platform metadata
        run: python -m unittest discover -s Source/DotNET/Screenplay.Mcp/Packaging -p 'test_*.py'
      # Screenplay.Mcp.csproj embeds this file only when it exists, so a missing board would not fail the build.
      - name: Download embedded event model board
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenplay-event-model-board
          path: Source/Screenplay/McpApp/dist
      - name: Require the embedded event model board
        run: test -s Source/Screenplay/McpApp/dist/event-model-board.html
      - name: Check native Windows missing short-name admission
        if: runner.os == 'Windows'
        run: dotnet test Source/DotNET/Screenplay.Mcp/Screenplay.Mcp.csproj --configuration Debug --filter 'FullyQualifiedName~when_refusing_repair_write_conflicts|FullyQualifiedName~when_comparing_missing_windows_aliases'
      - name: Check native Windows attachment opens
        if: runner.os == 'Windows'
        run: dotnet test Source/DotNET/Screenplay.Specs/Screenplay.Specs.csproj --configuration Debug --filter 'FullyQualifiedName~when_opening_windows_attachments'
      - name: Build self-contained server and packages
        env:
          VERSION: ${{ inputs.version || '0.0.0-desktop-ci' }}
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish Source/DotNET/Tool/Tool.csproj -c Release -r "$RID" --self-contained true -p:PackAsTool=false -p:Version="$VERSION" -o Artifacts/Desktop/publish
          python Source/DotNET/Screenplay.Mcp/Packaging/build.py --publish Artifacts/Desktop/publish --output Artifacts/Desktop/packages --version "$VERSION" --rid "$RID"
      - name: Smoke test both unpacked packages on the native OS
        run: python Source/DotNET/Screenplay.Mcp/Packaging/smoke.py Artifacts/Desktop/packages/*.mcpb Artifacts/Desktop/packages/*-plugin.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenplay-desktop-${{ matrix.rid }}
          path: |
            Artifacts/Desktop/packages/*.mcpb
            Artifacts/Desktop/packages/*-plugin.zip
            Artifacts/Desktop/packages/*.sha256
          if-no-files-found: error

  attach:
    if: inputs.release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screenplay-desktop-*
          merge-multiple: true
          path: desktop
      - name: Attach verified native packages to the matching release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd desktop
          sha256sum -c ./*.sha256
          gh release upload "v$VERSION" ./*.mcpb ./*-plugin.zip ./*.sha256 --clobber

  nightly-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [changes, board, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Nightly MCP desktop packages failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title | jq -r --arg t "$TITLE" 'map(select(.title == $t))[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label bug --body "The nightly native package matrix failed on main: $RUN_URL"
          fi
