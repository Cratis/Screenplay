name: Render Blueprint Samples

# Every domain blueprint sample has to render exactly as authored with the published CLI and the published blueprint packages. A sample that
# needs simplifying to render is a defect of the sample or of the renderer; this finds it before a user does (Cratis/Stage#457).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    branches:
      - "**"
    paths:
      - "Samples/**"
      - "Source/DotNET/Screenplay.CanonicalVectors.Specs/BrowserHarness/render-blueprint-samples.*"
      - ".github/workflows/render-blueprint-samples.yml"

permissions:
  contents: read

jobs:
  render-blueprint-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .Net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 23.x
          package-manager-cache: false

      - name: Install the published CLI
        run: dotnet tool install --global Cratis.Cli

      - name: Render every domain blueprint sample
        run: Source/DotNET/Screenplay.CanonicalVectors.Specs/BrowserHarness/render-blueprint-samples.sh "$RUNNER_TEMP/render-blueprint-samples"
