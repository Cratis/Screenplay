name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/DotNET/**"
      # The C# compiler is held to the TypeScript compiler's golden syntax, so a change to it is a C# change.
      - "Source/Screenplay/Compiler/Conformance/**"
      # The MCP server embeds the event model board, which is built from these.
      - "Source/Screenplay/McpApp/**"
      - "Source/Screenplay/Compiler/**"
      - "Source/Screenplay/EventModels/**"
      - "Source/Screenplay/Views/**"
      - "package.json"
      - "Documentation/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x

      - name: Yarn install
        run: yarn

      # The MCP server embeds the event model board page, and packing refuses without it.
      - name: Build event model board
        run: yarn workspaces foreach -Rt --from @cratis/screenplay-mcp-app run build

      - name: Build & run tests
        run: dotnet test --configuration Debug

      # The version is a sentinel, not a release. Package validation compares assembly versions, and one
      # below the baseline is rejected on that alone before the API surface is ever looked at - so it has to
      # be set on the build, since the pack below reuses what this produces.
      - name: Build Release
        run: dotnet build --configuration Release -p:Version=9999.0.0

      - name: Run canonical vectors on all supported runtimes
        run: dotnet test Source/DotNET/Screenplay.CanonicalVectors.Specs/Screenplay.CanonicalVectors.Specs.csproj --configuration Release --no-build --no-restore

      # Package validation only runs on pack, so a binary break was invisible until the release failed on
      # main - which is how eight versions came to be tagged with no package on NuGet. Packing here puts the
      # break in the pull request that causes it, which is what Directory.Build.props already claims happens.
      - name: Pack
        run: dotnet pack --no-build --configuration Release -o ./Artifacts/NuGet -p:Version=9999.0.0

      - name: Verify context package dependencies
        run: python3 Source/DotNET/Screenplay.Contexts/verify-package.py ./Artifacts/NuGet 9999.0.0
