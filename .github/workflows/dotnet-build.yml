name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/DotNET/**"
      - "*.props"
      - "*.targets"
      - "*.slnx"
      - "global.json"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build & run tests
        run: dotnet test --configuration Debug

      # The version is a sentinel, not a release. Package validation compares assembly versions, and one
      # below the baseline is rejected on that alone before the API surface is ever looked at - so it has to
      # be set on the build, since the pack below reuses what this produces.
      - name: Build Release
        run: dotnet build --configuration Release -p:Version=9999.0.0

      - name: Run canonical vectors on all supported runtimes
        run: dotnet test Source/DotNET/Screenplay.CanonicalVectors.Specs/Screenplay.CanonicalVectors.Specs.csproj --configuration Release --no-build --no-restore

      # Package validation only runs on pack, so a binary break was invisible until the release failed on
      # main - which is how eight versions came to be tagged with no package on NuGet. Packing here puts the
      # break in the pull request that causes it, which is what Directory.Build.props already claims happens.
      - name: Pack
        run: dotnet pack --no-build --configuration Release -o ./Artifacts/NuGet -p:Version=9999.0.0
