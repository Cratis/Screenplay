name: Verify AI Corpus Impact

# Called from pull-requests.yml; the PR triggers and path filters live there.

# Repository-local for now; promote this policy to Cratis/Workflows when shared.
# No paths filter: every PR gets a check, and the script passes unrelated changes.
# Only the PR identity comes from the event. Labels, draft status and evidence are read live.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  ai-corpus:
    name: ai-corpus / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 23.x
          package-manager-cache: false

      - name: Test corpus impact verifier
        run: node --test .github/scripts/tests/*.test.mjs

      - name: Verify corpus impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/verify-ai-corpus-impact.mjs
