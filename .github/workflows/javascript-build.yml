name: JavaScript Build

# Called from pull-requests.yml; the PR triggers and path filters live there.

concurrency:
  group: javascript-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Yarn install
        run: yarn

      # The root scripts run every workspace in dependency order, so a workspace that stops building fails
      # here rather than on the first merge that publishes.
      - name: Build
        run: yarn build

      - name: Compile
        run: yarn compile

      - name: Lint
        run: yarn lint:ci

      - name: Test
        run: yarn test
