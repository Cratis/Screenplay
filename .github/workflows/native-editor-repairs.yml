name: Native editor repairs

# Called from pull-requests.yml; the PR triggers and path filters live there.

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'
  # Release gate called from publish.yml: always the full native matrix, never skipped.
  workflow_call:
    inputs:
      release:
        description: 'Release gate: run the full matrix and never skip as already ran'
        default: true
        type: boolean

permissions:
  contents: read

# A called workflow inherits the caller's github.workflow and ref, so the release gate uses its own group: it can neither
# cancel or be cancelled by PR runs nor queue behind (deadlock with) publish.yml's own concurrency group.
concurrency:
  group: ${{ inputs.release && format('native-editor-release-{0}-{1}', github.ref, github.sha) || format('native-editor-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - id: gate
        # A release must never pass without the repairs having run.
        if: ${{ !inputs.release }}
        uses: Cratis/Workflows/.github/actions/skip-if-already-ran@main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && !inputs.release
        with:
          fetch-depth: 0
      - name: Select native repair matrix
        id: matrix
        shell: bash
        env:
          PR_SMOKE: ${{ github.event_name == 'pull_request' && !inputs.release }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          matrix='[{"runner":"ubuntu-latest","rid":"linux-x64","executable":"Cratis.Screenplay.Tool"},{"runner":"windows-latest","rid":"win-x64","executable":"Cratis.Screenplay.Tool.exe"},{"runner":"macos-15","rid":"osx-arm64","executable":"Cratis.Screenplay.Tool"}]'
          if [[ "$PR_SMOKE" == 'true' ]]; then
            matrix='[{"runner":"ubuntu-latest","rid":"linux-x64","executable":"Cratis.Screenplay.Tool"}]'
            changed_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            while IFS= read -r path; do
              case "$path" in
                Source/DotNET/Screenplay/Workspaces/*|Source/DotNET/Screenplay.Mcp/*|Source/DotNET/Tool/*|*.props|*.targets|global.json|.github/workflows/native-editor-repairs.yml)
                  matrix='[{"runner":"ubuntu-latest","rid":"linux-x64","executable":"Cratis.Screenplay.Tool"},{"runner":"windows-latest","rid":"win-x64","executable":"Cratis.Screenplay.Tool.exe"},{"runner":"macos-15","rid":"osx-arm64","executable":"Cratis.Screenplay.Tool"}]'
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  repair:
    name: Installed VSIX / ${{ matrix.rid }}
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SCREENPLAY_REPAIR_SERVER: ${{ github.workspace }}/.ai-work/native-server/${{ matrix.executable }}
      SCREENPLAY_REPAIR_VSIX: ${{ github.workspace }}/.ai-work/native-editor.vsix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Resolve native NuGet SDK cohort
        id: native-nuget-context
        run: |
          sdk="$(dotnet --version)"
          test -n "$sdk"
          printf 'sdk=%s\n' "$sdk" >> "$GITHUB_OUTPUT"
      - name: Cache native NuGet packages
        id: native-nuget
        uses: Cratis/Workflows/.github/actions/dotnet-cache@3f8a8a7ef75f72b6b089638b68ec2f9af8f593e3 # Workflows snapshot 2026-11-01 (issue #1139)
        with:
          path: ~/.nuget/packages
          key-prefix: native-nuget-v1-${{ matrix.rid }}-${{ runner.arch }}-sdk${{ steps.native-nuget-context.outputs.sdk }}
          key-files: |
            **/packages.lock.json
            **/*.props
            **/*.targets
            **/*.csproj
            **/[Nn]u[Gg]et.[Cc]onfig
            **/*.slnx
            **/*.sln
            **/global.json
            .github/workflows/mcp-desktop.yml
            .github/workflows/native-editor-repairs.yml
          mode: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'save' || 'restore' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing workspace dependencies
        timeout-minutes: 4
        run: |
          corepack enable
          yarn
      - name: Build extension and embedded server board
        timeout-minutes: 4
        run: yarn workspaces foreach -Rt --from screenplay --from @cratis/screenplay-mcp-app run build
      - name: Publish compatible self-contained native server
        timeout-minutes: 5
        run: dotnet publish Source/DotNET/Tool/Tool.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -p:PackAsTool=false -o .ai-work/native-server
      - name: Real C# tool subprocess safety gate
        timeout-minutes: 4
        run: yarn workspace screenplay test:repair-process
      - name: Package JavaScript-only production extension
        timeout-minutes: 3
        run: yarn workspace screenplay package --out "$SCREENPLAY_REPAIR_VSIX"
      - name: Inspect packaged payload and review UI contributions
        run: python Source/Screenplay/VSCodeExtension/tests/inspectVsix.py "$SCREENPLAY_REPAIR_VSIX"
      - name: Build existing extension-host harness
        run: yarn workspace screenplay build:test-host
      - name: Provision pinned native VS Code with test-electron
        timeout-minutes: 4
        working-directory: Source/Screenplay/VSCodeExtension
        run: node tests/prepareCiHost.mjs
      - name: Installed VSIX native host safety gate (Linux / Xvfb)
        if: runner.os == 'Linux'
        # Five installed-client lifetimes. Measured 113 s (1.9 min) locally on macOS arm64; 15 min = max(15, ceil(3 x 1.9)).
        timeout-minutes: 15
        run: xvfb-run --auto-servernum yarn workspace screenplay test:host
      - name: Installed VSIX native host safety gate (Windows / macOS)
        if: runner.os != 'Linux'
        # Five installed-client lifetimes. Measured 113 s (1.9 min) locally on macOS arm64; 15 min = max(15, ceil(3 x 1.9)).
        timeout-minutes: 15
        run: yarn workspace screenplay test:host
      - name: Preserve native logs and synthetic fixture locations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-editor-${{ matrix.rid }}
          path: |
            .ai-work/native-host-*/
          if-no-files-found: warn
          # The deliberately scoped synthetic native evidence lives beneath hidden .ai-work.
          include-hidden-files: true
